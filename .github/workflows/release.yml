name: Release

# Builds the desktop app (WP-08) and packs it with Velopack: Setup.exe, Portable.zip and the update packages that an
# installed app finds by itself in the GitHub release of the tag (WP-11). Run by hand, it builds the package as a
# workflow artifact without touching any release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Read-only by default: build and tests run code from NuGet packages (MSBuild targets, analyzers, tests) and must
# not hold a token that can replace release assets (review 1.0.3, A21). Only the release job may write.
permissions:
  contents: read

# Actions pinned to commits, as in pages.yml: this workflow publishes what the streamer installs, so a moved tag must
# not change what runs here. Dependabot (.github/dependabot.yml) keeps the pins current.

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build release (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Full history: the release notes link the previous version, which comes from the tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # A tag must match <Version> and have its CHANGELOG section, or the repository and the release disagree
      # (review 1.0.3, A22). Fails before anything is built.
      - name: Check version and changelog
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $props = [xml](Get-Content Directory.Build.props -Encoding utf8)
          $declared = @($props.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ })[0]
          if ($declared -ne $version) { throw "Tag $env:GITHUB_REF_NAME does not match <Version>$declared</Version> in Directory.Build.props." }
          $changelog = Get-Content CHANGELOG.md -Encoding utf8
          if (-not ($changelog -match "^##\s+\[$([regex]::Escape($version))\]")) { throw "CHANGELOG.md has no section for $version." }

      # Nothing gets published that does not pass the same checks as CI.
      - name: Build
        run: dotnet build PokeArena.slnx -c Release -warnaserror

      - name: Tests
        run: |
          dotnet test tests/PokeArena.Core.Tests -c Release --no-build
          dotnet test tests/PokeArena.UI.Tests -c Release --no-build
          dotnet test tests/PokeArena.Web.Tests -c Release --no-build
          dotnet test tests/PokeArena.Integration.Tests -c Release --no-build

      # A run by hand builds 0.0.1: vpk pack refuses 0.0.0 ("must be >= 0.0.1"). An installed copy never sees it, the
      # package only becomes a workflow artifact.
      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.1' }
          $name = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'dev' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT

      # A folder, not a single file: the BlazorWebView serves its static assets from wwwroot next to the program.
      # Self-contained, so the streamer's PC needs no .NET runtime (WebView2 ships with Windows 11).
      # Values from outside (the tag name) reach the scripts only through env, never pasted into the script text.
      - name: Publish
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >
          dotnet publish src/PokeArena.Desktop -c Release -r win-x64
          --self-contained true
          "-p:Version=$env:VERSION"
          -p:DebugType=none
          -o publish/PokeArena

      - name: Check the program folder
        shell: pwsh
        run: |
          if (Test-Path publish/PokeArena/appsettings.local.json) { throw 'Developer settings must not be shipped.' }
          if (-not (Test-Path publish/PokeArena/data/pokemon.json)) { throw 'Base data missing from the package.' }

      # Everything goes through local fast-forward merges, so generated notes would be a bare compare link; the
      # changelog section says what changed.
      - name: Release notes from the changelog
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.name }}
        run: |
          $version = $env:VERSION
          $tag = $env:TAG
          # Explicit encoding: read as ANSI, dashes and umlauts would arrive broken.
          $lines = Get-Content CHANGELOG.md -Encoding utf8

          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^##\s+\[$([regex]::Escape($version))\]") { $start = $i + 1; break }
          }

          if ($start -lt 0) { throw "No section for $version in CHANGELOG.md." }

          $end = $lines.Count
          for ($i = $start; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^##\s') { $end = $i; break }
          }

          $body = if ($end -gt $start) { ($lines[$start..($end - 1)] -join "`n").Trim() } else { '' }
          if (-not $body) { throw "The section for $version in CHANGELOG.md is empty." }

          # The next tag below this one, so rebuilding an older release never links forwards.
          $tags = @(git tag --list 'v*' --sort=-v:refname)
          $index = [array]::IndexOf($tags, $tag)
          $previous = if ($index -ge 0 -and $index + 1 -lt $tags.Count) { $tags[$index + 1] }
                      elseif ($index -lt 0) { $tags | Select-Object -First 1 }
                      else { $null }
          if ($previous) {
            $body += "`n`n**Full Changelog**: https://github.com/${{ github.repository }}/compare/$previous...$tag"
          }

          Set-Content release-notes.md -Value $body -Encoding utf8
          Write-Host $body

      # Velopack (WP-11, ADR-0010): Setup.exe, Portable.zip and the update packages an installed app downloads by
      # itself. vpk runs here, in the read-only job, like everything else from NuGet. Its version is pinned in
      # dotnet-tools.json and must match the Velopack package in Directory.Packages.props.
      - name: Restore tools
        run: dotnet tool restore

      # The packages of the latest release come first, so this one also gets a small delta package and its feed
      # lists the earlier versions. The very first Velopack release (1.5.0) finds none and has a full package only.
      - name: Previous release for the delta package
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          dotnet vpk download github --repoUrl $env:REPO_URL --token $env:GH_TOKEN --outputDir releases
          if ($LASTEXITCODE -ne 0) { Write-Host '::warning::No earlier Velopack release found; this one has a full package only.' }
          exit 0

      # packId is not "PokeArena": Velopack installs to %LOCALAPPDATA%\<packId> and deletes that folder on
      # uninstall, and %LOCALAPPDATA%\PokeArena holds the game data.
      - name: Pack
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          $notes = if (Test-Path release-notes.md) { @('--releaseNotes', 'release-notes.md') } else { @() }
          dotnet vpk pack --packId PokeArena.App --packVersion $env:VERSION --runtime win-x64 --packTitle PokeArena --packAuthors PokeArena `
            --packDir publish/PokeArena --mainExe PokeArena.exe --outputDir releases @notes
          if ($LASTEXITCODE -ne 0) { throw 'vpk pack failed.' }

          # Only this version's files go to its release; the downloaded packages of the previous one stay where they are.
          New-Item -ItemType Directory package | Out-Null
          Get-ChildItem releases -File -Filter "*-$env:VERSION-*.nupkg" | Copy-Item -Destination package

          # vpk pack lists every package in releases/ in its feed, the previous release's full package too. The app
          # merges the feeds of all releases and downloads each entry from the release whose feed lists it, so this
          # feed keeps only this version's entries — as `vpk upload github` would (review WP-11).
          $feed = Get-Content releases/releases.win.json -Raw -Encoding utf8 | ConvertFrom-Json
          $feed.Assets = @($feed.Assets | Where-Object { $_.Version -eq $env:VERSION })
          if ($feed.Assets.Count -eq 0) { throw "releases.win.json has no entry for $env:VERSION." }
          $feed | ConvertTo-Json -Depth 10 | Set-Content package/releases.win.json -Encoding utf8
          Copy-Item releases/PokeArena.App-win-Setup.exe "package/PokeArena-$env:NAME-Setup.exe"
          Copy-Item releases/PokeArena.App-win-Portable.zip "package/PokeArena-$env:NAME-Portable.zip"
          Get-ChildItem package | ForEach-Object { Write-Host $_.Name }

      # Run by hand: the package is the result. For a tag: handed to the release job.
      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: |
            package/
            release-notes.md
          if-no-files-found: error

  release:
    name: Attach to the GitHub release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: windows-latest
    timeout-minutes: 10
    # The only step with write access; it runs no code from the repository or its packages.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      # Attach to the release, creating it if it does not exist yet; a release written by hand keeps its text.
      - name: Attach to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # The feed goes up last and on its own: an installed app that reads it must find every package it names
          # (review WP-11).
          $all = Get-ChildItem package -File
          $feed = @($all | Where-Object Name -eq 'releases.win.json' | ForEach-Object FullName)
          $files = @($all | Where-Object Name -ne 'releases.win.json' | ForEach-Object FullName)
          if (-not $files -or -not $feed) { throw 'The package is incomplete.' }

          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $files --clobber
          } else {
            gh release create $env:TAG $files --title $env:TAG --notes-file release-notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'Uploading the packages failed.' }
          gh release upload $env:TAG $feed --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Uploading the feed failed.' }
