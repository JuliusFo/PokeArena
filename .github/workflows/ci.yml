# Build and tests on every push to main and every pull request.
# Windows only: the desktop host is WPF, and the integration tests use the Windows Credential Manager.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # Pinned like release.yml and pages.yml: a moved tag must not change what the required check runs, and the
      # token must not stay in .git/config while package code builds and tests (review 1.8.1, A15).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build PokeArena.slnx -c Release -warnaserror

      - name: Unit tests
        run: dotnet test tests/PokeArena.Core.Tests -c Release --no-build

      - name: Component tests
        run: dotnet test tests/PokeArena.UI.Tests -c Release --no-build

      - name: Website tests
        run: dotnet test tests/PokeArena.Web.Tests -c Release --no-build

      - name: Integration tests
        run: dotnet test tests/PokeArena.Integration.Tests -c Release --no-build
