# Builds the public website (src/PokeArena.Web) and deploys it to GitHub Pages. Only the app is deployed — the data
# lives in R2 and is uploaded by the desktop app (ADR-0003). Runs on each release tag v*, so the site and its
# „Neuigkeiten“ go live together with the desktop release, not when a branch is merged into main (user decision
# 2026-11-10). By hand: "Run workflow" with the release tag selected under "Use workflow from" — run from main it
# would publish changes that are not released yet.
#
# Setup (once, repository settings):
#   - Pages → Source: "GitHub Actions"; custom domain e.g. arena.<domain> (DNS: CNAME to juliusfo.github.io, DNS only).
#   - Variables → Actions → DATA_URL: the data host, e.g. https://arena-daten.<domain>/
#   - Environments → github-pages → Deployment branches and tags: add the tag rule `v*` (Pages allows only main by
#     default, and a tag run fails with "not allowed to deploy to github-pages").
name: Website

on:
  # Every release redeploys, website changed or not: GitHub ignores path filters on tag pushes.
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

# Actions pinned to commits, as in release.yml: this workflow deploys the public site, so a moved tag must not change
# what runs here. Dependabot (.github/dependabot.yml) keeps the pins current.

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Check the data URL
        env:
          DATA_URL: ${{ vars.DATA_URL }}
        run: |
          if [ -z "$DATA_URL" ]; then
            echo "::error::Repository variable DATA_URL is not set (Settings → Variables → Actions)."
            exit 1
          fi

      - name: Publish
        run: dotnet publish src/PokeArena.Web -c Release -o publish

      - name: Configure and prepare for Pages
        env:
          DATA_URL: ${{ vars.DATA_URL }}
        working-directory: publish/wwwroot
        run: |
          printf '{\n  "DataUrl": "%s"\n}\n' "$DATA_URL" > appsettings.json
          rm -f appsettings.json.br appsettings.json.gz
          # css/site.css has no hash in its name (the SDK fingerprints only JS modules in index.html), so a browser
          # could keep the old stylesheet next to the new markup of the hashed DLL — after 1.6.0 Firefox showed the HP
          # numbers twice (fix/css-cache-busting). The content hash as query makes every changed stylesheet a new URL.
          CSS_HASH=$(sha256sum css/site.css | cut -c1-12)
          sed -i "s|href=\"css/site.css\"|href=\"css/site.css?v=$CSS_HASH\"|" index.html
          grep -q "css/site.css?v=$CSS_HASH" index.html || { echo "::error::Stylesheet link not found in index.html."; exit 1; }
          rm -f index.html.br index.html.gz
          # Pages knows no SPA routing: deep links (/kampf/12) get 404.html, which boots the app on that URL.
          cp index.html 404.html
          # Serve folders starting with an underscore (_framework).
          touch .nojekyll

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: publish/wwwroot

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
